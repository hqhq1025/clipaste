name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ARCHIVE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('preflight-{0}', github.sha) }}

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Test and lint on the runner host
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/clipaste clipaste
          tar czf clipaste-${{ env.ARCHIVE_VERSION }}-${{ matrix.target }}.tar.gz clipaste

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clipaste-${{ matrix.target }}
          path: clipaste-${{ env.ARCHIVE_VERSION }}-${{ matrix.target }}.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked --release

      - name: Test and lint
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Package
        shell: bash
        run: |
          cp target/release/clipaste.exe clipaste.exe
          7z a clipaste-${{ env.ARCHIVE_VERSION }}-x86_64-pc-windows-msvc.zip clipaste.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clipaste-windows
          path: clipaste-${{ env.ARCHIVE_VERSION }}-x86_64-pc-windows-msvc.zip

  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build and isolated desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools xvfb xclip sway wl-clipboard dbus-x11 python3-pil

      - name: Build, test and lint the release target
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          cargo test --locked --target ${{ matrix.target }}
          cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Exercise the release binary on real X11 and Wayland selections
        run: CLIPASTE_TEST_BINARY="$PWD/target/${{ matrix.target }}/release/clipaste" bash tests/linux/run.sh

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/clipaste clipaste
          file clipaste
          if readelf -l clipaste | grep -q INTERP; then
            echo "Linux release binary must not require a dynamic loader" >&2
            exit 1
          fi
          tar czf clipaste-${{ env.ARCHIVE_VERSION }}-${{ matrix.target }}.tar.gz clipaste

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clipaste-${{ matrix.target }}
          path: clipaste-${{ env.ARCHIVE_VERSION }}-${{ matrix.target }}.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksum release archives
        run: |
          sha256sum clipaste-*.tar.gz clipaste-*.zip > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          sha256sum --check SHA256SUMS

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            clipaste-*.tar.gz
            clipaste-*.zip
            SHA256SUMS
          generate_release_notes: true
